
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#300711">
<title>GIFTSDROP MARKET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

:root{
 --bg:#090909;--panel:#111110;--gold:#d6b36a;
 --gold2:#f4dfa5;--muted:#929087;--line:rgba(214,179,106,.17);
 --white:#f5f1e8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;padding:0 17px calc(105px + env(safe-area-inset-bottom));
 background:radial-gradient(ellipse at 50% -10%,rgba(180,135,53,.16),transparent 48%),var(--bg);
 color:var(--white);font-family:'DM Sans',Arial,sans-serif;min-height:100vh;overflow-x:hidden;
}
header,.card,.footer,.tab-page{position:relative;z-index:1}
header{text-align:center;padding:25px 0}
.brand-mark{
 width:54px;height:54px;border:1px solid rgba(214,179,106,.5);
 border-radius:18px;margin:0 auto 15px;display:flex;align-items:center;
 justify-content:center;color:var(--gold2);font:29px 'Playfair Display';
 box-shadow:0 0 35px rgba(214,179,106,.12);transform:rotate(-5deg)
}
.logo{
 font:800 32px 'Playfair Display';letter-spacing:3px;
 background:linear-gradient(90deg,#b48b46,#f6e6b4,#c49b52,#f6e6b4);
 -webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{color:#8d877a;font-size:10px;letter-spacing:4px;margin-top:8px}
.top-label,.gift-soon{
 display:inline-block;margin-top:15px;border:1px solid var(--line);
 border-radius:30px;padding:8px 13px;color:var(--gold);
 font-size:10px;letter-spacing:1.5px
}
.card{
 background:linear-gradient(145deg,rgba(26,25,22,.97),rgba(15,15,14,.97));
 border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:15px;
 box-shadow:0 12px 35px rgba(0,0,0,.23);overflow:hidden
}
.card:after{
 content:"";position:absolute;top:0;left:18px;right:18px;height:1px;
 background:linear-gradient(90deg,transparent,rgba(244,223,165,.3),transparent)
}
.stats{display:flex;gap:11px}
.stat{
 flex:1;background:linear-gradient(145deg,#211f19,#151512);
 border:1px solid rgba(214,179,106,.14);border-radius:17px;padding:16px 10px;text-align:center
}
.stat small{color:var(--muted);font-size:11px}
.stat strong{display:block;color:var(--gold2);font:29px 'Playfair Display';margin-top:8px}
h2{font:700 21px 'Playfair Display';margin:0 0 15px;color:#f1e5c8}
.section-tag{color:var(--gold);font-size:9px;letter-spacing:2.5px;margin-bottom:8px}
.muted{color:var(--muted);font-size:12px;line-height:1.75;margin:0 0 13px}
button{
 width:100%;border:1px solid rgba(255,235,185,.45);border-radius:14px;
 padding:15px;margin-top:11px;font:800 12px 'DM Sans';letter-spacing:1px;
 color:#17130b;background:linear-gradient(110deg,#a77d36,#f1d997,#bd954d);
 cursor:pointer
}
button:disabled{opacity:.45;cursor:not-allowed}
button:active{transform:scale(.98)}
button.secondary{
 color:var(--gold2);background:linear-gradient(145deg,#252117,#171510);
 border:1px solid rgba(214,179,106,.25)
}
button.danger{color:#f0dada;background:#391d1d;border-color:#784040}
.notice{
 background:rgba(214,179,106,.055);border:1px solid rgba(214,179,106,.15);
 border-radius:13px;padding:13px;color:#bcb19a;font-size:11px;line-height:1.7;margin-top:14px
}
#message,#adminMessage,#topupMessage,#refMessage,#giftMessage,#giftAdminMessage{
 color:var(--gold2);font-size:12px;line-height:1.6;margin-top:12px
}
.odds{
 display:flex;justify-content:space-between;align-items:center;
 padding:12px 0;border-bottom:1px solid rgba(255,255,255,.055);
 font-size:12px;color:#bdb8ac
}
.odds:last-child{border-bottom:0}
.odds b{color:var(--gold2);font-size:13px}
.ref-stats{display:flex;justify-content:space-between;color:#c6bda9;font-size:11px}
.ref-stats b{color:var(--gold2)}
.progress{height:7px;background:#29261e;border-radius:20px;overflow:hidden;margin:14px 0}
.progress-fill{
 height:100%;width:0;background:linear-gradient(90deg,#9c7130,#f4dfa5);
 border-radius:20px;transition:width .5s
}
.ref-link{
 background:#0b0b09;border:1px solid rgba(214,179,106,.22);
 border-radius:12px;padding:14px;font-size:11px;color:#d9c28e;
 line-height:1.6;word-break:break-all;margin-top:13px
}
input,select{
 width:100%;padding:15px;border-radius:13px;border:1px solid rgba(214,179,106,.2);
 background:#0c0c0a;color:#f1e5c8;margin:8px 0;font:13px 'DM Sans';outline:none
}
.request{
 background:#171612;border:1px solid var(--line);border-radius:13px;
 padding:13px;margin:10px 0;color:#cfc4ae;font-size:12px;line-height:1.7
}
.request button{width:48%;display:inline-block;font-size:10px;padding:12px 5px}
#adminPanel,#giftAdminPanel{display:none}
.tab-page{display:none;animation:pageIn .28s ease}
.tab-page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.wheel-wrap{position:relative;padding:10px 0 14px}
.wheel-glow{
 position:absolute;width:220px;height:220px;border-radius:50%;
 background:rgba(214,179,106,.13);filter:blur(40px);top:50%;left:50%;transform:translate(-50%,-50%)
}
.wheel{
 position:relative;width:228px;height:228px;max-width:75vw;max-height:75vw;
 margin:10px auto;border-radius:50%;border:6px solid #f3d58a;
 background:conic-gradient(from -90deg,#f3c85f 0deg 324deg,#9b83ef 324deg 359.964deg,#ff6f9f 359.964deg 360deg);
 box-shadow:0 0 0 7px rgba(243,213,138,.12),0 10px 34px rgba(0,0,0,.3),0 0 35px rgba(214,179,106,.2);
 display:flex;align-items:center;justify-content:center;
 transition:transform 5.2s cubic-bezier(.12,.72,.12,1)
}
.wheel:before{content:"";position:absolute;inset:10px;border:2px dashed rgba(255,255,255,.68);border-radius:50%}
.wheel-center{
 width:94px;height:94px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#51406f,#201832 72%);
 border:4px solid #fff0b8;display:flex;flex-direction:column;align-items:center;justify-content:center;
 color:#fff;font-size:22px;font-weight:1000;letter-spacing:1px;line-height:1;
 box-shadow:0 0 25px rgba(255,239,184,.38);position:relative;z-index:2
}
.wheel-center small{font-size:10px;letter-spacing:3px;margin-top:5px;color:#ffe9a6}
.wheel-legend{
 display:grid;gap:9px;margin:4px 0 16px;padding:13px;
 border-radius:16px;background:rgba(255,255,255,.045);
 border:1px solid rgba(255,255,255,.09)
}
.wheel-legend-item{display:flex;align-items:center;gap:9px;color:#e8e0f5;font-size:12px}
.wheel-legend-item b{margin-left:auto;color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
.legend-dot{width:11px;height:11px;flex:0 0 11px;border-radius:50%;box-shadow:0 0 10px currentColor}
.empty-dot{background:#f3c85f;color:#f3c85f}
.nft-dot{background:#9b83ef;color:#9b83ef}
.unusual-dot{background:#b79cff;color:#b79cff}
.rare-dot{background:#ff6f9f;color:#ff6f9f}
.spin-pointer{
 position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;
 width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
 border-top:22px solid #f1d58d
}
.wheel-result{animation:resultGlow 1s ease}
@keyframes resultGlow{50%{filter:brightness(1.8);transform:scale(1.035)}}
.gift-hero{text-align:center;padding:12px 8px 20px}
.gift-icon{font-size:55px;margin:10px 0;filter:drop-shadow(0 0 20px rgba(214,179,106,.3))}
.market-title{font:800 25px 'Playfair Display';letter-spacing:2px;color:var(--gold2)}
.market-subtitle{font-size:9px;letter-spacing:3px;color:#9d927d;margin-top:8px}
.gift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.gift-product{
 min-width:0;border:1px solid rgba(214,179,106,.2);border-radius:17px;
 background:linear-gradient(145deg,#211f19,#11110f);padding:12px;text-align:center
}
.gift-art{
 height:104px;
 border-radius:12px;
 background:radial-gradient(circle,#40331b,#15130f 70%);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:48px;
 margin-bottom:11px;
 overflow:hidden;
}

.gift-art img{
 width:100%;
 height:100%;
 object-fit:contain;
 padding:8px;
}
.gift-name{font-size:11px;font-weight:800;color:#f2e4c5;min-height:30px}
.gift-price{color:var(--gold2);font-weight:800;font-size:16px;margin-top:8px}
.gift-old{font-size:10px;color:#777;text-decoration:line-through;margin-top:4px}
.gift-discount{font-size:9px;color:#d8bd7d;margin-top:5px}
.gift-product button{padding:12px 5px;font-size:10px;margin-top:10px}
.order-status{font-weight:800;color:var(--gold2)}
.order-card{
 background:#171612;border:1px solid var(--line);border-radius:13px;
 padding:13px;margin:10px 0;font-size:12px;line-height:1.8;color:#d0c5ae
}
.bottom-nav{
 position:fixed;z-index:20;bottom:0;left:0;right:0;
 padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 background:rgba(12,12,11,.94);backdrop-filter:blur(18px);
 border-top:1px solid rgba(214,179,106,.2);
 display:grid;grid-template-columns:repeat(4,1fr);gap:5px
}
.nav-button{
 margin:0;padding:9px 2px 7px;border:1px solid transparent;border-radius:13px;
 background:transparent;color:#777267;box-shadow:none;display:flex;flex-direction:column;
 align-items:center;gap:5px;font-size:9px;letter-spacing:.3px
}
.nav-icon{font-size:20px;line-height:1.2;opacity:.7}
.nav-button.active{
 color:var(--gold2);background:rgba(214,179,106,.1);
 border-color:rgba(214,179,106,.2)
}
.nav-button.active .nav-icon{opacity:1}
.footer{text-align:center;padding:15px 0 5px;color:#666052;font-size:9px;letter-spacing:3px}
@media(min-width:600px){
 body{max-width:480px;margin:0 auto}
 .bottom-nav{max-width:480px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* Плавное поздравление при любом выигрыше рулетки */
.win-message{
 position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);
 max-width:calc(100vw - 36px);white-space:nowrap;
 padding:15px 23px;border:1px solid rgba(255,173,214,.62);border-radius:20px;
 background:linear-gradient(135deg,rgba(87,17,57,.94),rgba(37,9,37,.96));
 color:#fff;font-size:clamp(20px,5.8vw,28px);font-weight:900;letter-spacing:.2px;
 text-shadow:0 0 18px rgba(255,105,180,.8);
 box-shadow:0 0 34px rgba(255,72,155,.38),inset 0 1px rgba(255,255,255,.2);
 opacity:0;animation:win-message-inout 3.1s cubic-bezier(.22,.75,.25,1) forwards;
}
@keyframes win-message-inout{
 0%{opacity:0;transform:translate(-50%,-42%) scale(.94);filter:blur(5px)}
 24%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}
 72%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:blur(0)}
 100%{opacity:0;transform:translate(-50%,-58%) scale(.98);filter:blur(4px)}
}
@media(prefers-reduced-motion:reduce){.win-message{animation-duration:.01ms!important;animation-iteration-count:1!important}}


/* Нежное сообщение при проигрыше рулетки */
.win-message.lose-message{
 border-color:rgba(190,174,255,.58);
 background:linear-gradient(135deg,rgba(38,24,67,.95),rgba(19,13,43,.97));
 color:#eee6ff;
 text-shadow:0 0 18px rgba(174,151,255,.7);
 box-shadow:0 0 34px rgba(144,112,255,.28),inset 0 1px rgba(255,255,255,.18);
}

/* Win celebrations: light for ordinary, premium for expensive NFTs */
.win-fx-layer{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}
.win-confetti{position:absolute;left:var(--x);top:-18px;width:7px;height:12px;border-radius:2px;background:var(--c);opacity:0;animation:confetti-fall var(--dur) cubic-bezier(.15,.65,.35,1) forwards;transform:rotate(var(--r))}
@keyframes confetti-fall{0%{opacity:0;transform:translate3d(0,-10px,0) rotate(0) scale(.6)}12%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),105vh,0) rotate(760deg) scale(1)}}
.win-burst{position:absolute;left:50%;top:46%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0 4%,#ffe69a 15%,#ff72b6 42%,rgba(116,229,255,.0) 72%);animation:burst-flash .9s ease-out forwards;filter:drop-shadow(0 0 28px #ff72b6)}
.win-ring{position:absolute;left:50%;top:46%;width:24px;height:24px;border:3px solid #ffe69a;border-radius:50%;transform:translate(-50%,-50%);animation:ring-expand 1.05s cubic-bezier(.1,.7,.2,1) forwards;box-shadow:0 0 22px #ff72b6,inset 0 0 12px #74e5ff}
.win-particle{position:absolute;left:50%;top:46%;width:9px;height:9px;border-radius:3px;background:var(--c);box-shadow:0 0 13px var(--c);animation:particle-blast 1.15s cubic-bezier(.1,.65,.2,1) forwards}
.win-shake{animation:screen-shake .48s ease-in-out 2}
@keyframes burst-flash{0%{opacity:0;scale:.1}18%{opacity:1;scale:13}100%{opacity:0;scale:22}}
@keyframes ring-expand{0%{opacity:1;width:20px;height:20px}100%{opacity:0;width:min(125vw,700px);height:min(125vw,700px);border-width:1px}}
@keyframes particle-blast{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(540deg) scale(.1)}}
@keyframes screen-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
@media(prefers-reduced-motion:reduce){.win-confetti,.win-burst,.win-ring,.win-particle,.win-shake{animation-duration:.01ms!important;animation-iteration-count:1!important}}

@media(prefers-reduced-motion:reduce){.wheel{transition-duration:.01ms}.tab-page{animation:none}}

/* Horizontal prize roulette */
.roulette-wrap{position:relative;margin:22px 0 13px;padding:24px 0 15px}
.roulette-glow{position:absolute;inset:15% 8%;background:linear-gradient(90deg,rgba(116,229,255,.12),rgba(255,114,182,.17));filter:blur(28px);pointer-events:none}
.roulette-window{position:relative;overflow:hidden;width:100%;padding:13px 0;border:1px solid rgba(185,162,255,.24);border-radius:19px;background:linear-gradient(180deg,rgba(9,8,27,.94),rgba(30,24,65,.92));box-shadow:inset 0 0 22px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.2)}
.roulette-window:before,.roulette-window:after{content:"";position:absolute;top:0;bottom:0;width:30px;z-index:2;pointer-events:none}
.roulette-window:before{left:0;background:linear-gradient(90deg,#171536,transparent)}
.roulette-window:after{right:0;background:linear-gradient(270deg,#171536,transparent)}
.roulette-track{display:flex;align-items:stretch;gap:9px;width:max-content;padding:0 12px;will-change:transform}
.roulette-item,.roulette-placeholder{width:88px;min-width:88px;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid rgba(184,169,255,.18);border-radius:14px;background:linear-gradient(150deg,rgba(75,63,127,.68),rgba(28,24,66,.95));color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.22)}
.roulette-item-art,.roulette-placeholder span{width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1.2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}.roulette-item-art img{width:100%;height:100%;object-fit:contain;display:block;}
.roulette-item b,.roulette-placeholder small{font-size:10px;letter-spacing:.5px}
.roulette-item small{font-size:8px;letter-spacing:1px;color:#aaa8c7}
.roulette-placeholder{opacity:.72}
.roulette-item-winner{border:2px solid #ffe69a;background:linear-gradient(145deg,rgba(255,207,90,.28),rgba(255,114,182,.2));box-shadow:0 0 20px rgba(255,207,90,.22)}
.roulette-item-winner.is-ordinary{border-color:#74e5ff;box-shadow:0 0 24px rgba(116,229,255,.42)}
.roulette-item-winner.is-unusual{border-color:#b79cff;background:linear-gradient(145deg,rgba(183,156,255,.24),rgba(116,229,255,.12));box-shadow:0 0 22px rgba(183,156,255,.55)}
.roulette-item-winner.is-rare{border-color:#ffcf5a;background:linear-gradient(145deg,rgba(255,207,90,.34),rgba(255,114,182,.3));box-shadow:0 0 18px rgba(255,207,90,.65),0 0 38px rgba(255,114,182,.35);animation:rareWinPulse 1.15s ease-in-out infinite alternate}
.roulette-item-winner.is-empty{border-color:#aaa8c7}
.roulette-pointer{position:absolute;z-index:4;left:50%;top:3px;transform:translateX(-50%);display:flex;justify-content:center;filter:drop-shadow(0 3px 7px rgba(255,207,90,.5))}
.roulette-pointer span{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:21px solid #ffe69a}
.roulette-caption{text-align:center;color:#aaa8c7;font-size:8px;font-weight:800;letter-spacing:1.8px;margin-top:13px}
@keyframes rareWinPulse{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.45);transform:scale(1.045)}}
