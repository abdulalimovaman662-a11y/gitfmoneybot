name: Rocket ledger regression tests

on:
  pull_request:
    paths:
      - "web/server.js"
      - "web/test/**"
      - "web/package.json"
      - ".github/workflows/rocket-ledger.yml"
  push:
    branches:
      - "rocket-ledger-audit"
    paths:
      - "web/server.js"
      - "web/test/**"
      - "web/package.json"
      - ".github/workflows/rocket-ledger.yml"

jobs:
  rocket-ledger:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rocket_test
          POSTGRES_PASSWORD: rocket_test
          POSTGRES_DB: rocket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rocket_test -d rocket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    env:
      ROCKET_TEST_DATABASE_URL: postgres://rocket_test:rocket_test@localhost:5432/rocket_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.js
      - run: npm test
