name: Mini-game tests

on:
  push:
    branches: [feature/giftsdrop-mini-games]
  pull_request:
    branches: [feature/giftsdrop-platform-foundation]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giftsdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d giftsdrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        working-directory: web
      - name: Run tests against isolated PostgreSQL
        run: npm test
        working-directory: web
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/giftsdrop_test
