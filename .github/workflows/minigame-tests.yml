name: Mini-game tests

on:
  push:
    branches:
      - feature/giftsdrop-mini-games
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: Run tests
        working-directory: web
        run: npm test
